<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MANGA AI - عالم المانهوا بالعربية</title>

<style>
:root {
  --bg:#0b0912;
  --card:#171322;
  --purple:#8b5cf6;
  --text:#f5f3ff;
  --muted:#aaa2bd;
  --border:#302640;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Tahoma,sans-serif;
}
header{
  padding:20px 6%;
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.logo{font-size:23px;font-weight:bold;color:#b99aff}
.container{max-width:1100px;margin:auto;padding:25px 18px}
.hero{text-align:center;padding:35px 10px}
.hero h1{font-size:34px;margin-bottom:12px}
.hero p{color:var(--muted);line-height:1.8}
.searchbox{max-width:650px;margin:25px auto;position:relative}
input{
  width:100%;padding:17px 20px;
  border:1px solid var(--border);
  border-radius:13px;
  background:var(--card);
  color:white;font-size:16px;outline:none;
}
input:focus{border-color:var(--purple)}
.suggestions{
  position:absolute;top:58px;right:0;left:0;
  background:#171322;border:1px solid var(--border);
  border-radius:12px;z-index:20;overflow:hidden;
  display:none;max-height:420px;overflow-y:auto;
}
.suggestion{
  display:flex;align-items:center;gap:13px;
  padding:10px;border-bottom:1px solid var(--border);
  cursor:pointer;text-align:right;
}
.suggestion:hover{background:#292039}
.suggestion img{width:48px;height:65px;object-fit:cover;border-radius:6px}
.suggestion div{flex:1}
.small{font-size:12px;color:var(--muted);margin-top:6px}
.section-title{margin:30px 0 18px;font-size:22px}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(155px,1fr));
  gap:17px;
}
.card{
  background:var(--card);border:1px solid var(--border);
  border-radius:12px;overflow:hidden;cursor:pointer;
  transition:.2s;
}
.card:hover{transform:translateY(-4px);border-color:var(--purple)}
.card img{width:100%;height:220px;object-fit:cover;background:#211a2d}
.card-info{padding:12px}
.card h3{font-size:15px;margin:0 0 9px}
.muted{color:var(--muted);font-size:12px;line-height:1.7}
.badge{
  display:inline-block;background:#302044;color:#c8aaff;
  padding:5px 9px;border-radius:20px;font-size:11px;margin:3px;
}
button{
  background:var(--purple);color:white;border:0;
  border-radius:9px;padding:11px 17px;
  font-size:14px;cursor:pointer;
}
button.secondary{background:#302640}
button:disabled{opacity:.5;cursor:not-allowed}
#details{display:none}
.detail-top{
  display:flex;gap:22px;align-items:flex-start;
  background:var(--card);padding:20px;border-radius:15px;
  border:1px solid var(--border);
}
.detail-cover{width:170px;max-width:35%;border-radius:10px}
.detail-info{flex:1}
.detail-info h1{margin-top:0}
.description{color:#c5bed1;line-height:1.9;white-space:pre-line}
.languages{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0}
.language{
  background:#241b32;border:1px solid var(--border);
  padding:9px 12px;border-radius:8px;font-size:13px
}
.chapter{
  background:var(--card);padding:14px;margin:9px 0;
  border:1px solid var(--border);border-radius:9px;
  display:flex;justify-content:space-between;gap:10px;
}
.status{color:#c4a5ff}
.message{color:var(--muted);padding:20px;text-align:center}
.hidden{display:none!important}
footer{text-align:center;padding:35px;color:var(--muted);font-size:13px}
@media(max-width:600px){
 .hero h1{font-size:26px}
 .detail-top{gap:13px;padding:13px}
 .detail-cover{width:115px}
 .detail-info h1{font-size:19px}
 .card img{height:190px}
}
</style>
</head>

<body>

<header>
  <div class="logo">MANGA AI</div>
  <div class="muted">عالم المانهوا بالعربية</div>
</header>

<main class="container">

<section id="home">
  <div class="hero">
    <h1>اكتشف عالم المانهوا</h1>
    <p>ابحث عن المانغا والمانهوا والمانها من مختلف المصادر.</p>

    <div class="searchbox">
      <input id="search" type="search"
        placeholder="ابحث بالاسم العربي أو الإنجليزي..."
        autocomplete="off">
      <div id="suggestions" class="suggestions"></div>
    </div>
  </div>

  <h2 class="section-title">نتائج البحث</h2>
  <div id="results" class="grid"></div>
  <div id="searchMessage" class="message">
    اكتب اسم المانهوا للبحث.
  </div>
</section>

<section id="details">
  <button class="secondary" onclick="goBack()">← رجوع</button>

  <div class="detail-top" style="margin-top:18px">
    <img id="detailCover" class="detail-cover" src="" alt="غلاف المانهوا">
    <div class="detail-info">
      <h1 id="detailTitle"></h1>
      <div id="detailOriginal" class="muted"></div>
      <div id="detailBadges"></div>
      <p id="detailDescription" class="description"></p>
      <div id="detailSource" class="muted"></div>
    </div>
  </div>

  <h2 class="section-title">الفصول واللغات المتوفرة</h2>
  <div id="languageList" class="languages"></div>
  <div id="chapterList"></div>
  <div id="chapterMessage" class="message"></div>
</section>

</main>

<footer>
  MANGA AI TRANSLATOR — منصة لاكتشاف المانهوا
</footer>

<script>
const API_BASE = "https://manga-ai-translator.onrender.com/api/v1";

const searchInput = document.getElementById("search");
const suggestions = document.getElementById("suggestions");
const results = document.getElementById("results");
const searchMessage = document.getElementById("searchMessage");

let searchTimer = null;
let currentItems = [];
let selectedItem = null;

function escapeHTML(value=""){
  return String(value).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",
    '"':"&quot;","'":"&#039;"
  }[c]));
}

function getTitle(item){
  return item.title ||
    item.name ||
    item.attributes?.title?.en ||
    item.attributes?.title?.["ja-ro"] ||
    "بدون عنوان";
}

function getCover(item){
  return item.cover_url ||
    item.cover ||
    item.image ||
    item.coverUrl ||
    "";
}

function getDescription(item){
  let d = item.description ||
    item.summary ||
    item.attributes?.description?.en ||
    "";
  if(typeof d === "object") d = d.en || "";
  return String(d).replace(/<[^>]*>/g,"");
}

function getStatus(item){
  return item.status || item.attributes?.status || "غير معروف";
}

function getYear(item){
  return item.year || item.startDate?.year ||
    item.attributes?.year || "";
}

function getScore(item){
  return item.score || item.rating || "";
}

async function searchManga(query){
  const url = `${API_BASE}/catalog/search?q=${encodeURIComponent(query)}&limit=15`;
  const response = await fetch(url);
  if(!response.ok) throw new Error("فشل البحث");
  const data = await response.json();
  return Array.isArray(data) ? data :
    data.results || data.items || data.data || [];
}

function renderSuggestions(items){
  suggestions.innerHTML = "";
  if(!items.length){
    suggestions.style.display="none";
    return;
  }

  items.slice(0,10).forEach(item=>{
    const row=document.createElement("div");
    row.className="suggestion";
    const cover=getCover(item);

    row.innerHTML=`
      <img src="${escapeHTML(cover)}" onerror="this.style.visibility='hidden'">
      <div>
        <strong>${escapeHTML(getTitle(item))}</strong>
        <div class="small">${escapeHTML(getStatus(item))} ${getYear(item)}</div>
      </div>
    `;

    row.addEventListener("click",()=>openDetails(item));
    suggestions.appendChild(row);
  });

  suggestions.style.display="block";
}

function renderResults(items){
  results.innerHTML="";
  if(!items.length){
    searchMessage.textContent="لم نعثر على نتائج.";
    searchMessage.classList.remove("hidden");
    return;
  }

  searchMessage.classList.add("hidden");

  items.forEach(item=>{
    const card=document.createElement("article");
    card.className="card";
    const cover=getCover(item);

    card.innerHTML=`
      <img src="${escapeHTML(cover)}"
        onerror="this.style.display='none'"
        alt="">
      <div class="card-info">
        <h3>${escapeHTML(getTitle(item))}</h3>
        <div class="muted">${escapeHTML(getStatus(item))}</div>
        ${getScore(item) ? `<span class="badge">⭐ ${escapeHTML(getScore(item))}</span>` : ""}
      </div>
    `;

    card.addEventListener("click",()=>openDetails(item));
    results.appendChild(card);
  });
}

searchInput.addEventListener("input",()=>{
  clearTimeout(searchTimer);
  const query=searchInput.value.trim();

  if(query.length<2){
    suggestions.style.display="none";
    results.innerHTML="";
    searchMessage.textContent="اكتب اسم المانهوا للبحث.";
    searchMessage.classList.remove("hidden");
    return;
  }

  searchTimer=setTimeout(async()=>{
    searchMessage.textContent="جاري البحث...";
    searchMessage.classList.remove("hidden");

    try{
      currentItems=await searchManga(query);
      renderSuggestions(currentItems);
      renderResults(currentItems);
    }catch(error){
      suggestions.style.display="none";
      searchMessage.textContent="تعذر الاتصال بمصدر البحث. حاول مجدداً.";
    }
  },350);
});

searchInput.addEventListener("keydown",async e=>{
  if(e.key==="Enter"){
    suggestions.style.display="none";
    if(currentItems.length) renderResults(currentItems);
  }
});

document.addEventListener("click",e=>{
  if(!e.target.closest(".searchbox")){
    suggestions.style.display="none";
  }
});

function showDetails(){
  document.getElementById("home").style.display="none";
  document.getElementById("details").style.display="block";
  window.scrollTo(0,0);
}

function goBack(){
  document.getElementById("details").style.display="none";
  document.getElementById("home").style.display="block";
  window.scrollTo(0,0);
}

async function openDetails(item){
  selectedItem=item;
  suggestions.style.display="none";
  showDetails();

  const title=getTitle(item);
  const cover=getCover(item);

  document.getElementById("detailTitle").textContent=title;
  document.getElementById("detailOriginal").textContent=
    item.original_title || item.originalTitle || "";
  document.getElementById("detailCover").src=cover;
  document.getElementById("detailDescription").textContent=
    getDescription(item) || "لا تتوفر نبذة لهذا العمل حالياً.";

  document.getElementById("detailBadges").innerHTML=`
    <span class="badge">${escapeHTML(getStatus(item))}</span>
    ${getYear(item) ? `<span class="badge">${escapeHTML(getYear(item))}</span>` : ""}
    ${getScore(item) ? `<span class="badge">⭐ ${escapeHTML(getScore(item))}</span>` : ""}
  `;

  document.getElementById("detailSource").textContent=
    "المصدر: " + (item.source || item.provider || "كتالوج الأعمال");

  document.getElementById("languageList").innerHTML="";
  document.getElementById("chapterList").innerHTML="";
  document.getElementById("chapterMessage").textContent="جاري فحص الفصول...";

  if(!String(item.id || "").startsWith("mangadex-")){
    document.getElementById("chapterMessage").textContent=
      "فحص الفصول لهذا المصدر غير متاح حالياً. لا يعني ذلك أن العمل بلا فصول.";
    return;
  }

  const mangaId=String(item.id).replace("mangadex-","");
  await loadChapters(mangaId);
}

const languageNames={
  ar:"العربية",en:"الإنجليزية",fr:"الفرنسية",
  ko:"الكورية",ja:"اليابانية",zh:"الصينية",
  es:"الإسبانية",pt-br:"البرتغالية",
  ru:"الروسية",de:"الألمانية",it:"الإيطالية",
  tr:"التركية",id:"الإندونيسية",th:"التايلاندية",
  vi:"الفيتنامية"
};

async function loadChapters(mangaId){
  const message=document.getElementById("chapterMessage");
  const list=document.getElementById("chapterList");
  const languages=document.getElementById("languageList");

  try{
    const response=await fetch(
      `${API_BASE}/manga/${encodeURIComponent(mangaId)}/chapters`
    );

    if(!response.ok) throw new Error("تعذر جلب الفصول");

    const data=await response.json();
    const chapters=data.chapters || data.results || [];
    const available=data.available_languages || [];

    languages.innerHTML="";
    available.forEach(lang=>{
      const code=typeof lang==="string" ? lang : lang.code || lang.language;
      const name=languageNames[code] || code;
      const tag=document.createElement("span");
      tag.className="language";
      tag.textContent=name;
      languages.appendChild(tag);
    });

    list.innerHTML="";

    if(!chapters.length){
      message.textContent=
        "لم تُرجع خدمة الفصول بيانات لهذا العمل حالياً.";
      return;
    }

    message.textContent=`عدد الفصول المعروضة: ${chapters.length}`;

    chapters.forEach(ch=>{
      const row=document.createElement("div");
      row.className="chapter";

      const chapterName=ch.chapter || ch.chapter_number ||
        ch.title || "فصل";
      const lang=ch.language || ch.translatedLanguage || "";
      const langName=languageNames[lang] || lang;

      row.innerHTML=`
        <div>
          <strong>الفصل ${escapeHTML(chapterName)}</strong>
          <div class="small">${escapeHTML(ch.title || "")}</div>
        </div>
        <span class="badge">${escapeHTML(langName)}</span>
      `;

      list.appendChild(row);
    });

  }catch(error){
    message.textContent=
      "تعذر تحميل الفصول حالياً. جرّب مرة أخرى لاحقاً.";
  }
}
</script>

</body>
</html>
